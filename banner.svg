<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3776ab"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#ffd43b"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.15" r="0.65">
      <stop offset="0%" stop-color="#3776ab" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#3776ab" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.95" r="0.6">
      <stop offset="0%" stop-color="#ffd43b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffd43b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow1)"/>
  <rect width="1200" height="320" fill="url(#glow2)"/>

  <!-- floating particles -->
  <circle cx="1050" cy="70" r="4" fill="#58a6ff" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -14; 0 0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="150" r="3" fill="#ffd43b" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="6s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="220" r="3" fill="#3fb950" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="7s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="260" r="2.5" fill="#00d4ff" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="4.5s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- name -->
  <text x="60" y="118" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="bold" fill="#f0f6fc">Roberto Carlos Alvarez Cerna</text>

  <!-- subtitle with blinking cursor -->
  <text x="60" y="168" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ffd43b">Desarrollador de Software <tspan fill="#3fb950"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>▋</tspan></text>

  <!-- rotating stack line -->
  <text x="60" y="218" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#3fb950">&gt; </text>
  <text x="96" y="218" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#58a6ff" opacity="0">Python · Flask · PostgreSQL<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.19;0.25" dur="12s" begin="0s" repeatCount="indefinite"/></text>
  <text x="96" y="218" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#58a6ff" opacity="0">Power Platform · Power BI · SharePoint<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.19;0.25" dur="12s" begin="3s" repeatCount="indefinite"/></text>
  <text x="96" y="218" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#58a6ff" opacity="0">Plataforma de gestión de planta<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.19;0.25" dur="12s" begin="6s" repeatCount="indefinite"/></text>
  <text x="96" y="218" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#58a6ff" opacity="0">Baird — asistente personal con IA<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.19;0.25" dur="12s" begin="9s" repeatCount="indefinite"/></text>

  <!-- status line -->
  <circle cx="68" cy="258" r="6" fill="#3fb950">
    <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="84" y="264" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8b949e">Celaya, Guanajuato · Plataforma en producción</text>

  <!-- bottom gradient bar with moving highlight -->
  <rect x="60" y="292" width="1080" height="4" rx="2" fill="url(#bar)"/>
  <rect x="60" y="292" width="180" height="4" rx="2" fill="#ffffff" opacity="0.55">
    <animate attributeName="x" values="60;960;60" dur="6s" repeatCount="indefinite"/>
  </rect>

  <rect x="1" y="1" width="1198" height="318" rx="10" fill="none" stroke="#21262d" stroke-width="2"/>
</svg>
